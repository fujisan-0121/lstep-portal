name: CI
# audio-app の型チェックと単体テスト、および public リポジトリ向けの検査。PR と main への push で動く
# クロス査読の前提となる「壊れていないこと」の最低限の確認
on:
  pull_request:
    # edited: PR 本文の査読欄を埋めたら再判定する
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audio-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: audio-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audio-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # リポジトリ全体を対象にする検査。working-directory を付けない（リポジトリルートで動かす）
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Access を経由しない入口が無いこと（wrangler 設定に false が明示されていること）
        run: |
          set -euo pipefail
          cfg=audio-app/wrangler.jsonc
          test -f "$cfg" || { echo "::error::$cfg が見つかりません（検査対象を移動したときは本ワークフローも更新すること）"; exit 1; }
          # 行頭または空白の直後の /* だけをブロックコメントとみなす（"/api/*" のようなパスは対象外）
          if grep -Eq '(^|[[:space:]])/\*' "$cfg"; then
            echo "::error::$cfg にブロックコメント（/* */）があります。行単位の検査が誤判定するため // を使うこと"
            exit 1
          fi
          for key in preview_urls workers_dev; do
            if grep -Eq "^[[:space:]]*\"$key\"[[:space:]]*:[[:space:]]*true" "$cfg"; then
              echo "::error::$cfg の $key が true です（Access を経由しない入口ができます）"
              exit 1
            fi
            if ! grep -Eq "^[[:space:]]*\"$key\"[[:space:]]*:[[:space:]]*false" "$cfg"; then
              echo "::error::$cfg に \"$key\": false の明示がありません（省略時の既定は有効側です）"
              exit 1
            fi
          done
          echo "wrangler: ok"
      - name: 秘密情報のファイル名がコミットされていないこと（リポジトリ全体）
        run: |
          set -euo pipefail
          if git ls-files \
            | grep -E '(^|/)\.dev\.vars($|\.)|(^|/)\.env($|\.)|(^|/)\.envrc$|(^|/)id_(rsa|ed25519|ecdsa)($|\.)|\.(pem|key|p12|pfx|p8|jks)$' \
            | grep -Ev '\.(example|sample|template|dist|pub)$'; then
            echo "::error::秘密情報のファイル名がコミットされています。一度 push した秘密は削除では戻らないので、鍵をローテーションすること"
            exit 1
          fi
          echo "secrets: ok"

  # 査読対象のファイルを変えた PR で、本文の査読欄が空なら落とす（Vault の CROSS_REVIEW.md）
  review-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 要査読の変更に査読記録があること
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --no-renames --diff-filter=ACMRT "$BASE_SHA" HEAD)
          targets=$(printf '%s\n' "$changed" | grep -E '^(audio-app/(src|migrations|scripts)/|audio-app/wrangler\.jsonc$|audio-app/package(-lock)?\.json$|\.github/|scripts/)|(^|/)(AGENTS|CLAUDE)\.md$|\.(ts|tsx|js|mjs|cjs|sql|sh|ya?ml|jsonc?)$' || true)
          if [ -z "$targets" ]; then echo "要査読の変更なし"; exit 0; fi
          echo "要査読の変更:"; printf '%s\n' "$targets"
          field() { printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -E "^[[:space:]]*-[[:space:]]*$1[^:：]*[:：]" | head -n1 | sed -E 's/^[^:：]*[:：][[:space:]]*//; s/[[:space:]]+$//' || true; }
          tool=$(field '査読ツール'); p01=$(field 'P0 / P1')
          fail=0
          pending='未実施|未査読|依頼中|依頼予定|応答待ち|^(todo|tbd|n/?a)$'
          if [ -z "$tool" ] || printf '%s\n' "$tool" | grep -Eq '^(-|ー|なし|無し)$' || printf '%s\n' "$tool" | grep -Eqi "$pending"; then echo "::error::PR 本文の「査読ツール」が未記入です"; fail=1; fi
          if [ -z "$p01" ] || printf '%s\n' "$p01" | grep -Eq '^(-|ー)$' || printf '%s\n' "$p01" | grep -Eqi "$pending"; then echo "::error::PR 本文の「P0 / P1 の有無と対応」が未記入です"; fail=1; fi
          exit $fail
