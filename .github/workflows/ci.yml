name: CI
# audio-app の型チェックと単体テスト、および public リポジトリ向けの検査。PR と main への push で動く
# クロス査読の前提となる「壊れていないこと」の最低限の確認
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audio-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: audio-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audio-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # リポジトリ全体を対象にする検査。working-directory を付けない（リポジトリルートで動かす）
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Access を経由しない入口が無いこと（wrangler 設定に false が明示されていること）
        run: |
          set -euo pipefail
          cfg=audio-app/wrangler.jsonc
          test -f "$cfg" || { echo "::error::$cfg が見つかりません（検査対象を移動したときは本ワークフローも更新すること）"; exit 1; }
          for key in preview_urls workers_dev; do
            if grep -Eq "^[^/]*\"$key\"[[:space:]]*:[[:space:]]*true" "$cfg"; then
              echo "::error::$cfg の $key が true です（Access を経由しない入口ができます）"
              exit 1
            fi
            if ! grep -Eq "^[^/]*\"$key\"[[:space:]]*:[[:space:]]*false" "$cfg"; then
              echo "::error::$cfg に \"$key\": false の明示がありません（省略時の既定は有効側です）"
              exit 1
            fi
          done
          echo "wrangler: ok"
      - name: 秘密情報のファイル名がコミットされていないこと（リポジトリ全体）
        run: |
          set -euo pipefail
          if git ls-files \
            | grep -E '(^|/)\.dev\.vars($|\.)|(^|/)\.env($|\.)|(^|/)\.envrc$|(^|/)id_(rsa|ed25519|ecdsa)($|\.)|\.(pem|key|p12|pfx|p8|jks)$' \
            | grep -Ev '\.(example|sample|template|dist)$'; then
            echo "::error::秘密情報のファイル名がコミットされています。一度 push した秘密は削除では戻らないので、鍵をローテーションすること"
            exit 1
          fi
          echo "secrets: ok"
