<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内音声ライブラリ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="en">Voice Library</span>
      <h1>社内<span>音声</span>ライブラリ</h1>
    </div>
    <nav class="nav" id="nav" aria-label="メニュー"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main" id="main">
    <div class="page"><div class="card empty">読み込み中…</div></div>
  </main>
</div>

<div class="player" id="player" aria-label="再生中">
  <div class="now">
    <div class="cat" id="p-cat"></div>
    <div class="t" id="p-title" role="button" tabindex="0" title="エピソードを開く"></div>
  </div>
  <div class="ctl">
    <div class="btns">
      <button class="skip" id="p-back" aria-label="15秒戻る">−15</button>
      <button class="pp" id="p-play" aria-label="再生 / 一時停止"></button>
      <button class="skip" id="p-fwd" aria-label="15秒進む">+15</button>
    </div>
    <div class="seek">
      <span id="p-cur">0:00</span>
      <input type="range" id="p-seek" min="0" max="1000" value="0" aria-label="再生位置">
      <span id="p-dur">0:00</span>
    </div>
  </div>
  <div class="right">
    <button class="speed" id="p-speed" aria-label="再生速度">1×</button>
    <button class="close" id="p-close" aria-label="プレイヤーを閉じる">×</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="login" id="login" hidden>
  <span class="en">Voice Library</span>
  <h1>ログインが必要です</h1>
  <p>ログインの有効期限が切れたか、社内メンバーとして認証されていません。ページを再読み込みして、会社のアカウントでログインしてください。</p>
  <button class="btn primary" style="margin-top:20px" onclick="location.reload()">再読み込み</button>
</div>

<script src="/app.js"></script>
</body>
</html>
