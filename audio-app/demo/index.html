<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内音声ライブラリ（デモ）</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../public/style.css">
</head>
<body>
<!-- デモ版: Cloudflare なしで画面を確認するためのページ。データはこのブラウザの localStorage にだけ保存されます -->
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img class="mark" src="../public/logo-mark.png" alt="MARKELINE">
      <div>
        <span class="en">Markeline · Demo</span>
        <h1>社内<span>音声</span>ライブラリ</h1>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="メニュー"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main" id="main">
    <div class="page"><div class="card empty">読み込み中…</div></div>
  </main>
</div>

<div class="player" id="player" aria-label="再生中">
  <div class="now">
    <div class="cat" id="p-cat"></div>
    <div class="t" id="p-title" role="button" tabindex="0" title="エピソードを開く"></div>
  </div>
  <div class="ctl">
    <div class="btns">
      <button class="skip" id="p-back" aria-label="15秒戻る">−15</button>
      <button class="pp" id="p-play" aria-label="再生 / 一時停止"></button>
      <button class="skip" id="p-fwd" aria-label="15秒進む">+15</button>
      <button class="speed" id="p-speed" aria-label="再生速度" aria-haspopup="true">1×</button>
      <div class="speed-menu" id="speed-menu" role="menu" hidden></div>
    </div>
    <div class="seek">
      <span id="p-cur">0:00</span>
      <input type="range" id="p-seek" min="0" max="1000" value="0" aria-label="再生位置">
      <span id="p-dur">0:00</span>
    </div>
  </div>
  <div class="right">
    <button class="close" id="p-close" aria-label="プレイヤーを閉じる">×</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="login" id="login" hidden>
  <span class="en">Voice Library</span>
  <h1>ログインが必要です</h1>
  <p>デモ版ではこの画面は表示されません。</p>
</div>

<script src="../public/demo-mock.js"></script>
<script src="../public/app.js"></script>
</body>
</html>
