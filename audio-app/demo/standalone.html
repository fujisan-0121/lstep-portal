<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内音声ライブラリ（デモ）</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 社内音声配信 — MARKELINE ロゴの2色（ティール #009098 / イエロー #F8B800）を軸にした配色 */
:root {
  --teal: #009098;         /* ロゴのティール。テキストのアクセント、ピル、リンク */
  --teal-deep: #0A6F76;    /* ホバー、濃いめのティール */
  --teal-ink: #0B4F55;     /* サイドバー・プレイヤーの地色 */
  --teal-ink-mid: #0F5F66;
  --teal-ink-soft: #17707A;
  --yellow: #F8B800;       /* ロゴのイエロー。再生ボタン、進捗、アクティブ表示 */
  --yellow-deep: #D99F00;
  --yellow-pale: #FFF6D6;
  --bg: #F5FAFA;           /* ティールをほんの少し含んだ白 */
  --tint: #E8F3F3;         /* 薄いティールの面 */
  --tint-deep: #D9E9EA;
  --border: #CFE1E2;
  --muted: #6B8385;
  --text: #123A3E;
  --white: #FFFFFF;
  --green: #1E8A5A;
  --green-pale: #E3F4EA;
  --red: #C24A3A;
  --red-pale: #FAE9E6;
  --shadow: 0 8px 24px rgba(11, 79, 85, .10);
  --sidebar-w: 240px;
  --player-h: 84px;
  --radius: 12px;
  --display: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Noto Sans JP', sans-serif;
  --sans: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  --en: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── 骨組み ───────────────────────────── */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex: none;
  background: var(--teal-ink); color: var(--white);
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 28px 18px calc(var(--player-h) + 16px);
}
.brand { padding: 0 8px 22px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
.brand .mark { width: 36px; height: 36px; flex: none; }
.brand .en { font-family: var(--en); font-size: 10px; letter-spacing: .16em; color: var(--yellow); text-transform: uppercase; display: block; margin-bottom: 2px; font-weight: 600; white-space: nowrap; }
.brand h1 { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: 0; line-height: 1.35; white-space: nowrap; }
.brand h1 span { color: var(--yellow); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-family: var(--en); font-size: 10px; letter-spacing: .16em; color: rgba(255,255,255,.45); text-transform: uppercase; padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  color: rgba(255,255,255,.78); font-size: 13.5px;
  transition: background .15s, color .15s; width: 100%; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.08); color: var(--white); }
.nav-item.active { background: var(--yellow); color: var(--teal-ink); font-weight: 700; }
.nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,.4); }
.nav-item.active .dot { box-shadow: 0 0 0 1.5px rgba(11,79,85,.35); }
.nav-item .cnt { margin-left: auto; font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; font-family: var(--en); }
.nav-item svg { width: 16px; height: 16px; flex: none; }
.quick-rec {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  margin: 4px 0 8px; padding: 11px 12px; border-radius: 999px;
  background: var(--yellow); color: var(--teal-ink); font-weight: 700; font-size: 13.5px;
  box-shadow: 0 4px 14px rgba(248,184,0,.3); transition: background .15s, transform .1s;
}
.quick-rec:hover { background: var(--yellow-deep); }
.quick-rec:active { transform: translateY(1px); }
.quick-rec svg { width: 18px; height: 18px; fill: currentColor; }
.btn .ico { display: inline-flex; }
.btn .ico svg { width: 16px; height: 16px; fill: currentColor; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.hero-actions .btn.hero-cat { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: var(--white); padding: 7px 12px; font-size: 12.5px; }
.hero-actions .btn.hero-cat:hover { background: rgba(255,255,255,.22); }
.hero-actions .btn.hero-cat .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,.5); }
.me { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 12px; color: rgba(255,255,255,.65); }
.me b { display: block; color: var(--white); font-weight: 500; font-size: 13px; }
.me button { color: var(--yellow); font-size: 11px; padding: 2px 0; }

.main { flex: 1; min-width: 0; padding: 36px 40px calc(var(--player-h) + 40px); }
.page { max-width: 960px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.page-head .en { font-family: var(--en); font-size: 11px; letter-spacing: .18em; color: var(--teal); text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: 600; }
.page-head h2 { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: .01em; line-height: 1.3; text-wrap: balance; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 4px; }
h3.section { font-family: var(--display); font-size: 17px; font-weight: 700; margin: 32px 0 12px; display: flex; align-items: center; gap: 10px; }
h3.section::after { content: ''; flex: 1; height: 1px; background: var(--border); }
h3.section .more { font-family: var(--sans); font-size: 12px; color: var(--teal); font-weight: 500; }

/* ── 部品 ───────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--teal); color: var(--white); border: 1px solid var(--teal);
  transition: background .15s, transform .1s; white-space: nowrap;
}
.btn:hover { background: var(--teal-deep); border-color: var(--teal-deep); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--teal-ink); }
.btn.primary:hover { background: var(--yellow-deep); border-color: var(--yellow-deep); }
.btn.ghost { background: transparent; color: var(--teal-ink); border-color: var(--border); }
.btn.ghost:hover { background: var(--tint); }
.btn.danger { background: transparent; color: var(--red); border-color: transparent; }
.btn.danger:hover { background: var(--red-pale); }
.btn.sm { padding: 5px 12px; font-size: 12px; }

.input, .select, .textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--white); font-size: 13.5px; transition: border-color .15s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--teal); outline: none; }
.textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: var(--tint); color: var(--teal-ink); white-space: nowrap; letter-spacing: .02em;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }
.pill.done { background: var(--green-pale); color: var(--green); }
.pill.partial { background: var(--yellow-pale); color: #8A6400; }
.pill.none { background: var(--tint); color: var(--muted); }
.pill.draft { background: var(--tint-deep); color: var(--muted); }
.pill.admin { background: var(--yellow); color: var(--teal-ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--white); font-size: 12.5px; color: var(--teal-ink); display: inline-flex; align-items: center; gap: 7px;
  transition: all .15s;
}
.chip:hover { border-color: var(--teal); }
.chip.active { background: var(--teal); color: var(--white); border-color: var(--teal); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .n { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; font-family: var(--en); }

.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
.empty { padding: 44px 20px; text-align: center; color: var(--muted); font-size: 13px; }
.empty b { display: block; font-family: var(--display); color: var(--teal-ink); font-size: 15px; margin-bottom: 4px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .input { max-width: 280px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

.progress { height: 5px; background: var(--tint-deep); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--yellow); border-radius: 3px; transition: width .3s; }
.progress.done > i { background: var(--teal); }

/* ── エピソード一覧 ───────────────────────────── */
.ep-list { display: flex; flex-direction: column; gap: 10px; }
.ep-row {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 16px; align-items: center;
  padding: 14px 18px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  transition: border-color .15s, box-shadow .15s; cursor: pointer;
}
.ep-row:hover { border-color: var(--teal); box-shadow: var(--shadow); }
.ep-row.playing { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow-pale); }
.play-btn {
  width: 48px; height: 48px; border-radius: 50%; background: var(--teal); color: var(--white);
  display: inline-flex; align-items: center; justify-content: center; flex: none; transition: background .15s, transform .1s;
}
.play-btn:hover { background: var(--yellow); color: var(--teal-ink); }
.play-btn svg { width: 18px; height: 18px; fill: currentColor; }
.play-btn.lg { width: 72px; height: 72px; background: var(--yellow); color: var(--teal-ink); }
.play-btn.lg svg { width: 28px; height: 28px; }
.play-btn.lg:hover { background: var(--yellow-deep); }
.ep-row .body { min-width: 0; }
.ep-row .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
.ep-row .title { font-family: var(--display); font-size: 15.5px; font-weight: 700; line-height: 1.4; }
.ep-row .desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep-row .progress { margin-top: 8px; max-width: 320px; }
.ep-row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 11.5px; color: var(--muted); }

.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.ep-card { padding: 18px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, box-shadow .15s; }
.ep-card:hover { border-color: var(--teal); box-shadow: var(--shadow); }
.ep-card .title { font-family: var(--display); font-size: 15px; font-weight: 700; line-height: 1.45; }
.ep-card .meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); }
.ep-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }

/* ── ホーム ───────────────────────────── */
.hero {
  background: var(--teal); color: var(--white); border-radius: 18px; padding: 30px 32px;
  display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; position: relative; overflow: hidden;
}
.hero::before { content: ''; position: absolute; right: -70px; top: -90px; width: 260px; height: 260px; border-radius: 50%; background: rgba(248,184,0,.18); }
.hero::after { content: ''; position: absolute; right: 90px; bottom: -120px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.07); }
.hero > * { position: relative; }
.hero .en { font-family: var(--en); font-size: 11px; letter-spacing: .2em; color: var(--yellow); text-transform: uppercase; font-weight: 600; }
.hero h2 { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 6px 0 4px; line-height: 1.4; }
.hero p { color: rgba(255,255,255,.8); font-size: 13px; }
.hero .stats { display: flex; gap: 22px; }
.hero .stat { text-align: right; }
.hero .stat b { display: block; font-family: var(--en); font-size: 34px; line-height: 1; font-weight: 600; }
.hero .stat span { font-size: 11px; color: rgba(255,255,255,.7); }

/* ── エピソード詳細 ───────────────────────────── */
.ep-head { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 26px 28px; background: var(--white); border: 1px solid var(--border); border-radius: 18px; }
.ep-head .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.ep-head h2 { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
.ep-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.ep-desc { padding: 22px 28px; white-space: pre-wrap; line-height: 1.85; font-size: 14px; max-width: 70ch; }
.ep-desc:empty { display: none; }
details.transcript { margin-top: 12px; }
details.transcript > summary { cursor: pointer; padding: 14px 28px; font-weight: 600; color: var(--teal); list-style: none; display: flex; align-items: center; gap: 8px; }
details.transcript > summary::before { content: ''; width: 0; height: 0; border-left: 6px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .15s; }
details.transcript[open] > summary::before { transform: rotate(90deg); }
details.transcript > .ep-desc { border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text); max-height: 60vh; overflow-y: auto; }

.comments { display: flex; flex-direction: column; gap: 12px; }
.comment { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 14px 16px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--teal); color: var(--white); display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 15px; font-weight: 700; flex: none; }
.avatar.o { background: var(--yellow); color: var(--teal-ink); }
.comment .who { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.comment .who b { color: var(--teal-ink); font-weight: 700; font-size: 13px; }
.comment .who .del { margin-left: auto; color: var(--muted); font-size: 11px; }
.comment .who .del:hover { color: var(--red); }
.comment .text { white-space: pre-wrap; line-height: 1.7; font-size: 13.5px; }
.comment-form { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 16px; background: var(--tint); border-radius: var(--radius); }
.comment-form .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

/* ── プレイヤーバー ───────────────────────────── */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--player-h); z-index: 50;
  background: var(--teal-ink); color: var(--white); border-top: 1px solid rgba(255,255,255,.1);
  display: grid; grid-template-columns: minmax(180px, 1fr) minmax(300px, 2fr) minmax(60px, 1fr); align-items: center; gap: 20px;
  padding: 0 24px; transform: translateY(100%); transition: transform .3s ease;
}
.player.on { transform: none; }
.player .now { min-width: 0; }
.player .now .cat { font-family: var(--en); font-size: 10px; color: var(--yellow); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.player .now .t { font-family: var(--display); font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.player .ctl { display: flex; flex-direction: column; gap: 6px; }
.player .btns { display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; }
.player .btns button { color: var(--white); display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; transition: background .15s; }
.player .btns button:hover { background: rgba(255,255,255,.12); }
.player .btns .skip { width: 40px; height: 34px; font-family: var(--en); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.player .btns .pp { width: 44px; height: 44px; background: var(--yellow); color: var(--teal-ink); }
.player .btns .pp:hover { background: var(--yellow-deep); }
.player .btns .pp svg { width: 16px; height: 16px; fill: currentColor; }
.player .btns .speed { min-width: 52px; height: 30px; padding: 0 10px; border: 1px solid rgba(255,255,255,.25); font-family: var(--en); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.player .btns .speed:hover, .player .btns .speed.open { border-color: var(--yellow); color: var(--yellow); }
.speed-menu {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--white); color: var(--teal-ink); border-radius: 12px; padding: 6px; box-shadow: 0 12px 30px rgba(11,79,85,.25);
  display: flex; gap: 4px; z-index: 60;
}
.speed-menu button { min-width: 52px; height: 34px; border-radius: 8px; font-family: var(--en); font-size: 12.5px; font-weight: 600; color: var(--teal-ink); }
.speed-menu button:hover { background: var(--tint); }
.speed-menu button.active { background: var(--yellow); color: var(--teal-ink); }
.player .seek { display: flex; align-items: center; gap: 10px; font-size: 11px; font-variant-numeric: tabular-nums; font-family: var(--en); color: rgba(255,255,255,.75); }
.player input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(255,255,255,.22); border-radius: 2px; }
.player input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); cursor: pointer; }
.player input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--yellow); cursor: pointer; }
.player .right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.player .close { color: rgba(255,255,255,.55); font-size: 18px; width: 30px; height: 30px; border-radius: 50%; }
.player .close:hover { background: rgba(255,255,255,.12); color: var(--white); }

/* ── 管理 ───────────────────────────── */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
.tab { padding: 10px 16px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
.tab:hover { color: var(--teal-ink); }
.tab.active { color: var(--teal-ink); border-bottom-color: var(--yellow); font-weight: 700; }

.table-wrap { overflow-x: auto; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--tint); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--yellow-pale); }
td .progress { width: 120px; }
td.actions { white-space: nowrap; text-align: right; }

.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { padding: 16px 18px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); }
.tile .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.tile .v { font-family: var(--en); font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 4px; color: var(--teal-ink); }
.tile .v small { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }

.upload-box { border: 2px dashed var(--border); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); font-size: 13px; background: var(--white); transition: border-color .15s; cursor: pointer; }
.upload-box:hover, .upload-box.drag { border-color: var(--teal); }
.upload-box b { display: block; color: var(--teal-ink); font-weight: 700; margin-bottom: 2px; }
.upload-box input { display: none; }
.upload-bar { height: 8px; background: var(--tint-deep); border-radius: 4px; overflow: hidden; margin-top: 12px; }
.upload-bar > i { display: block; height: 100%; background: var(--yellow); width: 0; transition: width .2s; }

/* ── 録音 ───────────────────────────── */
.seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button.active { background: var(--white); color: var(--teal-ink); box-shadow: 0 1px 3px rgba(11,79,85,.15); }
.rec-panel { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.rec-btn { width: 76px; height: 76px; border-radius: 50%; background: var(--yellow); color: var(--teal-ink); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(248,184,0,.35); transition: transform .1s, background .15s; }
.rec-btn:hover { background: var(--yellow-deep); }
.rec-btn:active { transform: scale(.96); }
.rec-btn svg { width: 30px; height: 30px; fill: currentColor; }
.rec-btn.stop { background: var(--red); color: var(--white); box-shadow: 0 6px 18px rgba(194,74,58,.35); }
.rec-btn.stop:hover { background: #A63D2F; }
.rec-time { font-family: var(--en); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--teal-ink); line-height: 1; }
.rec-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.rec-status .live { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: recblink 1s infinite; }
.rec-status .live.paused { background: var(--muted); animation: none; }
@keyframes recblink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.rec-level { width: 100%; max-width: 320px; height: 6px; background: var(--tint-deep); border-radius: 3px; overflow: hidden; }
.rec-level > i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .08s linear; }
.rec-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.rec-preview { width: 100%; }
.rec-preview audio { width: 100%; margin-top: 4px; }
.rec-hint { font-size: 12px; color: var(--muted); text-align: center; max-width: 42ch; }

.modal-bg { position: fixed; inset: 0; background: rgba(11,79,85,.55); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg); border-radius: 18px; width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 26px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h3 { font-family: var(--display); font-size: 18px; font-weight: 700; margin-bottom: 18px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--player-h) + 20px); transform: translateX(-50%); background: var(--teal-ink); color: var(--white); padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 90; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.toast.err { background: var(--red); }

.login { position: fixed; inset: 0; background: var(--teal-ink); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; z-index: 100; }
.login .en { font-family: var(--en); font-size: 12px; letter-spacing: .2em; color: var(--yellow); text-transform: uppercase; font-weight: 600; }
.login h1 { font-family: var(--display); font-size: 24px; margin: 12px 0 8px; }
.login p { color: rgba(255,255,255,.75); font-size: 13px; max-width: 42ch; }

/* ── モバイル ───────────────────────────── */
@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; padding: 16px 16px 8px; }
  .brand { padding-bottom: 12px; margin-bottom: 8px; }
  .brand .mark { width: 32px; height: 32px; }
  .brand h1 { font-size: 15px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .nav-label { display: none; }
  .nav-item { white-space: nowrap; width: auto; padding: 7px 12px; }
  .nav-item .cnt { display: none; }
  .quick-rec { width: auto; margin: 0; padding: 7px 14px; white-space: nowrap; }
  .me { padding: 8px 4px 0; font-size: 11px; }
  .me > span, .me > br { display: none; }
  .me b { display: inline; margin-right: 8px; }
  .main { padding: 22px 16px calc(var(--player-h) + 30px); }
  .page-head h2 { font-size: 22px; }
  .form-grid { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; padding: 22px; }
  .hero .stats { justify-content: flex-start; }
  .hero .stat { text-align: left; }
  .ep-row { grid-template-columns: 44px 1fr; }
  .ep-row .side { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; }
  .ep-head { grid-template-columns: 1fr; }
  .player { grid-template-columns: 1fr auto; gap: 4px 10px; height: auto; padding: 10px 14px 12px; }
  .player .now { display: flex; gap: 8px; align-items: baseline; }
  .player .now .cat { flex: none; white-space: nowrap; }
  .player .ctl { grid-column: 1 / -1; }
  .player .right { grid-row: 1; grid-column: 2; }
  :root { --player-h: 118px; }
}

</style>
</head>

      ep(7, '雑談回：AIを使いはじめて変わった1日の過ごし方', 5, '肩の力を抜いて聴いてください。朝のルーティンにAIを組み込んだら、何が変わったか。', 25),

      transcript: 'おはようございます。今日は下期に向けて、一つだけお願いしたいことがあって、それは「人が変わっても回る仕組み」を各部署で一つずつ作ってほしい、ということです。（中略）業務フローだけじゃなくて、お客様対応のトーク集みたいなものも対象にしてもらって大丈夫です。むしろ属人化しやすいところから優先で。十月の中間共有会で、各部署から一つずつ持ち寄ってもらえればと思います。よろしくお願いします。',
    });
    Object.assign(episodes[1], { knowledge_status: 'done', notion_page_url: 'https://www.notion.so/demo-ceo-message', summary: '【概要】\n先週の訪問先で「実は困っていて」と打ち明けられた経験から、お客様の困りごとに最初に気づく存在であることの価値を語る。数字より先に現場の一言を拾う姿勢を求める。', transcript: '（デモ用の文字起こし）先週、あるお客様のところに伺ったときに、帰り際に「実は困っていて」と言われまして。' });

    const play = (episode_id, member_id, ratio, count, days) => ({
      id: episode_id * 100 + member_id, episode_id, member_id,
      position_sec: Math.round(DEMO_DURATION * ratio), max_position_sec: Math.round(DEMO_DURATION * ratio),

    const plays = [

      play(2, 1, 1, 1, 3), play(2, 2, 1, 1, 3), play(2, 3, 1, 1, 2), play(2, 4, 0.3, 1, 3), play(2, 5, 1, 1, 2),
      play(3, 1, 1, 1, 7), play(3, 2, 1, 3, 6), play(3, 5, 0.62, 2, 5), play(3, 6, 0.15, 1, 4),
      play(4, 2, 1, 1, 11), play(4, 3, 1, 1, 10), play(4, 4, 1, 1, 10), play(4, 5, 1, 1, 9), play(4, 6, 1, 2, 8),
      play(5, 1, 1, 1, 30), play(5, 2, 1, 1, 30), play(5, 3, 1, 1, 29), play(5, 4, 1, 1, 29), play(5, 5, 1, 1, 28),
      play(6, 2, 1, 1, 17), play(6, 3, 0.8, 1, 16), play(6, 4, 1, 1, 15),

    const comments = [
      { id: 1, episode_id: 1, member_id: 2, body: '「人が変わっても回る仕組み」、まず自分の引き継ぎ資料から見直します。10月の共有会までに1つ作ります。', created_at: ago(0, 20), deleted_at: null },
      { id: 2, episode_id: 1, member_id: 4, body: '質問です。仕組み化の対象は業務フローだけですか？ お客様対応のトーク集なども含めてよいでしょうか。', created_at: ago(0, 18), deleted_at: null },
      { id: 3, episode_id: 1, member_id: 1, body: 'トーク集も大歓迎です。むしろ属人化しやすいところから優先で。', created_at: ago(0, 16), deleted_at: null },

  const urlCache = new Map();
  window.demoUrlCache = urlCache;
  window.demoAudioUrl = function demoAudioUrl(ep) {
    if (urlCache.has(ep.id)) return urlCache.get(ep.id);
    const rate = 22050, sec = DEMO_DURATION, n = rate * sec;
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
    const base = 196 * Math.pow(2, ((ep.id * 5) % 12) / 12);
    const scale = [0, 2, 4, 7, 9, 12, 14];
    let seedv = ep.id * 7919;
    const rnd = () => { seedv = (seedv * 1103515245 + 12345) & 0x7fffffff; return seedv / 0x7fffffff; };
    const notes = Array.from({ length: sec * 2 }, () => base * Math.pow(2, scale[Math.floor(rnd() * scale.length)] / 12));
    for (let i = 0; i < n; i++) {
      const t = i / rate, idx = Math.floor(t * 2), local = (t * 2) % 1;
      const env = Math.exp(-local * 3) * (1 - Math.exp(-local * 60));
      const f = notes[idx];
      const s = (Math.sin(2 * Math.PI * f * t) * 0.6 + Math.sin(2 * Math.PI * f * 2 * t) * 0.25 + Math.sin(2 * Math.PI * f * 3 * t) * 0.1) * env * 0.35;

      v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s * fade)) * 32767, true);
    }
    const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    urlCache.set(ep.id, url);
    return url;
  };

<script>
/* ブラウザ録音 → MP3
 * マイク入力を Web Audio で受け取り、録音しながら Web Worker 内の LAME (lamejs) で MP3 に変換する。
 * どの端末で録っても MP3 になるので、iPhone / Android / PC のどれでも再生できる。
 * LAME は LGPL: https://lame.sourceforge.net / lamejs: https://github.com/zhuker/lamejs */
(() => {
  'use strict';

  const WORKER_SRC = `
    let enc = null, parts = [];
    self.onmessage = (e) => {
      const m = e.data;
      try {
        if (m.type === 'init') {
          importScripts(m.lameUrl);
          enc = new lamejs.Mp3Encoder(1, m.sampleRate, m.kbps);
          parts = [];
          postMessage({ type: 'ready' });
        } else if (m.type === 'chunk') {
          const out = enc.encodeBuffer(m.samples);
          if (out.length) parts.push(new Uint8Array(out));
        } else if (m.type === 'finish') {
          const out = enc.flush();
          if (out.length) parts.push(new Uint8Array(out));
          const blob = new Blob(parts, { type: 'audio/mpeg' });
          parts = [];
          postMessage({ type: 'done', blob });
        }
      } catch (err) {
        postMessage({ type: 'error', message: String(err && err.message || err) });
      }
    };`;

  const AC = window.AudioContext || window.webkitAudioContext;
  const supported = !!(AC && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.Worker);

  function lameUrl() {
    if (window.__LAME_URL__) return window.__LAME_URL__;
    return new URL('vendor/lame.min.js', document.baseURI).href;
  }

  const rec = {
    supported,
    state: 'idle',
    _ctx: null, _stream: null, _src: null, _proc: null, _gain: null, _worker: null,
    _samples: 0, _sampleRate: 48000, _onLevel: null, _onTime: null, _lastTime: 0,

    async start({ onLevel, onTime, kbps = 64 } = {}) {
      if (!supported) throw new Error('このブラウザは録音に対応していません');
      if (this.state !== 'idle') throw new Error('すでに録音中です');
      this._onLevel = onLevel || null;
      this._onTime = onTime || null;
      this._samples = 0;
      this._lastTime = 0;

      // 1. マイク許可（ユーザー操作の直後に呼ぶこと。iOS はこの順序が重要）
      this._stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
      }).catch((e) => {
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw new Error('マイクの使用が許可されませんでした。ブラウザのアドレスバー付近の設定でマイクを許可してください');
        if (e && e.name === 'NotFoundError') throw new Error('マイクが見つかりません');
        throw new Error('マイクを開始できませんでした: ' + (e && e.message || e));
      });

      // 2. 音声処理
      this._ctx = new AC();
      if (this._ctx.state === 'suspended') await this._ctx.resume();
      this._sampleRate = this._ctx.sampleRate;

      // 3. エンコーダー (Worker)
      const workerUrl = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
      this._worker = new Worker(workerUrl);
      await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('MP3 変換の準備に時間がかかりすぎています。通信環境を確認してください')), 15000);
        this._worker.onmessage = (e) => {
          if (e.data.type === 'ready') { clearTimeout(t); resolve(); }
          else if (e.data.type === 'error') { clearTimeout(t); reject(new Error('MP3 変換を開始できません: ' + e.data.message)); }
        };
        this._worker.onerror = (e) => { clearTimeout(t); reject(new Error('MP3 変換の部品を読み込めませんでした (' + (e.message || 'worker error') + ')')); };
        this._worker.postMessage({ type: 'init', lameUrl: lameUrl(), sampleRate: this._sampleRate, kbps });
      }).catch((err) => { this._cleanup(); throw err; });

      this._src = this._ctx.createMediaStreamSource(this._stream);
      this._proc = this._ctx.createScriptProcessor(4096, 1, 1);
      this._gain = this._ctx.createGain();
      this._gain.gain.value = 0; // スピーカーには出さない（ハウリング防止）
      this._proc.onaudioprocess = (e) => {
        if (this.state !== 'recording') return;
        const f = e.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f.length);
        let sum = 0;
        for (let i = 0; i < f.length; i++) {
          const s = Math.max(-1, Math.min(1, f[i]));
          i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          sum += s * s;
        }
        this._samples += f.length;
        this._worker.postMessage({ type: 'chunk', samples: i16 }, [i16.buffer]);
        if (this._onLevel) this._onLevel(Math.min(1, Math.sqrt(sum / f.length) * 4));
        const t = this._samples / this._sampleRate;
        if (this._onTime && t - this._lastTime >= 0.25) { this._lastTime = t; this._onTime(t); }
      };
      this._src.connect(this._proc);
      this._proc.connect(this._gain);
      this._gain.connect(this._ctx.destination);
      this.state = 'recording';
    },

    pause() { if (this.state === 'recording') this.state = 'paused'; },
    resume() { if (this.state === 'paused') this.state = 'recording'; },
    get duration() { return this._samples / this._sampleRate; },

    /** 停止して MP3 を返す */
    async stop() {
      if (this.state !== 'recording' && this.state !== 'paused') throw new Error('録音していません');
      this.state = 'stopping';
      const duration = this.duration;
      const worker = this._worker;
      const blob = await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('MP3 の書き出しに時間がかかりすぎています')), 60000);
        worker.onmessage = (e) => {
          if (e.data.type === 'done') { clearTimeout(t); resolve(e.data.blob); }
          else if (e.data.type === 'error') { clearTimeout(t); reject(new Error(e.data.message)); }
        };
        worker.postMessage({ type: 'finish' });
      }).finally(() => this._cleanup());
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const name = `recording-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.mp3`;
      const file = new File([blob], name, { type: 'audio/mpeg' });
      return { blob, file, duration };
    },

    cancel() { if (this.state !== 'idle') this._cleanup(); },

    _cleanup() {
      try { if (this._proc) { this._proc.disconnect(); this._proc.onaudioprocess = null; } } catch (e) { /* noop */ }
      try { if (this._src) this._src.disconnect(); } catch (e) { /* noop */ }
      try { if (this._gain) this._gain.disconnect(); } catch (e) { /* noop */ }
      try { if (this._stream) this._stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* noop */ }
      try { if (this._ctx) this._ctx.close(); } catch (e) { /* noop */ }
      try { if (this._worker) this._worker.terminate(); } catch (e) { /* noop */ }
      this._proc = this._src = this._gain = this._stream = this._ctx = this._worker = null;
      this.state = 'idle';
    },
  };

  window.AudioRecorder = rec;
})();

</script>
<script>
/* 社内音声配信 — フロントエンド（ビルド不要の素の JavaScript） */
(() => {
  'use strict';

  /* ───────── ユーティリティ ───────── */
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const fmtTime = (sec) => {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
  };
  const fmtDur = (sec) => {
    sec = Number(sec) || 0;
    if (!sec) return '';
    const m = Math.round(sec / 60);
    return m < 1 ? `${Math.round(sec)}秒` : m < 60 ? `${m}分` : `${Math.floor(m / 60)}時間${m % 60}分`;
  };
  const fmtDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  };
  const fmtDateTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return `${fmtDate(iso)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };
  const relDate = (iso) => {
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'たった今';
    if (diff < 3600) return `${Math.floor(diff / 60)}分前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
    if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}日前`;
    return fmtDate(iso);
  };
  const pct = (ep) => {
    const dur = Number(ep.duration_sec) || 0, pos = Number(ep.my_max_position_sec) || 0;
    if (ep.my_completed) return 100;
    return dur > 0 ? Math.min(99, Math.round((pos / dur) * 100)) : 0;
  };
  const statusPill = (ep) => {
    if (ep.my_completed) return '<span class="pill done">聴了</span>';
    if (ep.my_last_played_at) return `<span class="pill partial">${pct(ep)}% まで</span>`;
    return '<span class="pill none">未再生</span>';
  };
  const initial = (name) => esc((name || '?').trim().charAt(0));
  const catPill = (ep) => ep.category_name ? `<span class="pill"><span class="dot" style="background:${esc(ep.category_color || '#F8B800')}"></span>${esc(ep.category_name)}</span>` : '<span class="pill none">未分類</span>';

  let toastTimer;
  const toast = (msg, err = false) => {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast on' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
  };

  /* ───────── API ───────── */
  async function api(path, opts = {}) {
    const init = { ...opts };
    if (init.json !== undefined) {
      init.body = JSON.stringify(init.json);
      init.headers = { 'Content-Type': 'application/json', ...(init.headers || {}) };
      delete init.json;
    }
    const res = await (window.__DEMO__ ? window.demoFetch(path, init) : fetch(path, init));
    if (res.status === 401) {
      $('#login').hidden = false;
      throw new Error('ログインが必要です');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `エラーが起きました (${res.status})`);
    return data;
  }

  /* ───────── 状態 ───────── */
  const state = { me: null, isAdmin: false, categories: [], episodes: [], route: { name: 'home' } };

  /* ───────── プレイヤー ───────── */
  const audio = new Audio();
  audio.preload = 'metadata';
  const player = {
    ep: null,
    speeds: [1, 1.25, 1.5, 2],
    speedIdx: (() => { try { const i = Number(localStorage.getItem('audio_speed_idx')); return i >= 0 && i < 4 ? i : 0; } catch (e) { return 0; } })(),
    lastSent: 0,
    seeking: false,
    async load(ep, autoplay = true) {
      if (this.ep && this.ep.id === ep.id) {
        if (autoplay) this.toggle();
        return;
      }
      if (this.ep) await this.report(false);
      this.ep = ep;
      $('#player').classList.add('on');
      $('#p-cat').textContent = ep.category_name || '未分類';
      $('#p-title').textContent = ep.title;
      $('#p-seek').value = 0;
      $('#p-cur').textContent = '0:00';
      $('#p-dur').textContent = fmtTime(ep.duration_sec);
      audio.src = window.__DEMO__ ? window.demoAudioUrl(ep) : `/api/episodes/${ep.id}/audio`;
      const resume = Number(ep.my_position_sec) || 0;
      const dur = Number(ep.duration_sec) || 0;
      const shouldResume = resume > 5 && (!dur || resume < dur * 0.9);
      audio.playbackRate = this.speeds[this.speedIdx];
      const onMeta = () => {
        if (shouldResume) audio.currentTime = resume;
        audio.removeEventListener('loadedmetadata', onMeta);
      };
      audio.addEventListener('loadedmetadata', onMeta);
      if (autoplay) {
        try { await audio.play(); } catch (e) { /* 自動再生がブロックされた場合はユーザー操作を待つ */ }
      }
      if (shouldResume) toast(`${fmtTime(resume)} から再開します`);
      this.started = true;
      this.renderState();
      renderRoute(false);
    },
    toggle() {
      if (!this.ep) return;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    },
    skip(sec) {
      if (!this.ep) return;
      audio.currentTime = Math.max(0, Math.min((audio.duration || 0) || Infinity, audio.currentTime + sec));
    },
    setSpeed(idx) {
      this.speedIdx = idx;
      audio.playbackRate = this.speeds[idx];
      try { localStorage.setItem('audio_speed_idx', String(idx)); } catch (e) { /* noop */ }
      this.renderSpeed();
      toast(`再生速度 ${this.speeds[idx]}×`);
    },
    renderSpeed() {
      $('#p-speed').textContent = `${this.speeds[this.speedIdx]}×`;
      document.querySelectorAll('#speed-menu button').forEach((b) => b.classList.toggle('active', Number(b.dataset.speed) === this.speedIdx));
    },
    toggleSpeedMenu(force) {
      const menu = $('#speed-menu');
      const open = force !== undefined ? force : menu.hidden;
      menu.hidden = !open;
      $('#p-speed').classList.toggle('open', open);
    },
    async close() {
      if (!this.ep) return;
      await this.report(false);
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      this.ep = null;
      $('#player').classList.remove('on');
      renderRoute(false);
    },
    renderState() {
      const playing = this.ep && !audio.paused;
      $('#p-play').innerHTML = playing ? ICON.pause : ICON.play;
      document.querySelectorAll('[data-play]').forEach((b) => {
        const isCur = this.ep && Number(b.dataset.play) === this.ep.id;
        b.innerHTML = isCur && playing ? ICON.pause : ICON.play;
        const row = b.closest('.ep-row, .ep-card, .ep-head');
        if (row) row.classList.toggle('playing', !!isCur);
      });
    },
    async report(started, keepalive = false) {
      if (!this.ep) return;
      const position = audio.currentTime || 0;
      const duration = isFinite(audio.duration) ? audio.duration : (Number(this.ep.duration_sec) || 0);
      const ep = this.ep;
      try {
        const r = await api(`/api/episodes/${ep.id}/progress`, { method: 'POST', json: { position, duration, started }, keepalive });
        // ローカル状態にも反映（一覧の進捗表示用）
        const patch = (e) => {
          if (!e || e.id !== ep.id) return;
          e.my_position_sec = position;
          e.my_max_position_sec = Math.max(Number(e.my_max_position_sec) || 0, position);
          e.my_last_played_at = new Date().toISOString();
          if (!e.duration_sec && duration) e.duration_sec = duration;
          if (r.completed && !e.my_completed) { e.my_completed = 1; e.listener_count = e.listener_count; }
        };
        patch(ep);
        state.episodes.forEach(patch);
        if (state.detail && state.detail.episode) patch(state.detail.episode);
        this.lastSent = Date.now();
      } catch (e) { /* 通信失敗時は次回に再送 */ }
    },
  };
  audio.addEventListener('play', () => {
    player.renderState();
    if (player.started) { player.report(true); player.started = false; }
  });
  audio.addEventListener('pause', () => { player.renderState(); player.report(false); });
  audio.addEventListener('ended', async () => {
    player.renderState();
    await player.report(false);
    toast('最後まで聴きました');
    renderRoute(false);
  });
  audio.addEventListener('timeupdate', () => {
    if (!player.ep || player.seeking) return;
    const dur = audio.duration || Number(player.ep.duration_sec) || 0;
    if (dur) $('#p-seek').value = (audio.currentTime / dur) * 1000;
    $('#p-cur').textContent = fmtTime(audio.currentTime);
    if (isFinite(audio.duration)) $('#p-dur').textContent = fmtTime(audio.duration);
    if (!audio.paused && Date.now() - player.lastSent > 15000) player.report(false);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && player.ep && !audio.paused) player.report(false, true); });
  window.addEventListener('pagehide', () => { if (player.ep) player.report(false, true); });

  const ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
    mic: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>',
    stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  };

  /* ───────── ルーティング ───────── */
  function parseRoute() {
    const hash = location.hash.replace(/^#\/?/, '');
    const [path, qs] = hash.split('?');
    const seg = path.split('/').filter(Boolean);
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    if (seg[0] === 'archive') return { name: 'archive', cat: seg[1] || '', q: q.q || '' };
    if (seg[0] === 'episode' && seg[1]) return { name: 'episode', id: Number(seg[1]) };
    if (seg[0] === 'admin') return { name: 'admin', tab: seg[1] || 'episodes', id: seg[2] ? Number(seg[2]) : null };
    return { name: 'home' };
  }
  const go = (hash) => { location.hash = hash; };

  async function renderRoute(reload = true) {
    state.route = parseRoute();
    const r = state.route;
    document.querySelectorAll('.nav-item').forEach((n) => {
      const key = n.dataset.nav;
      n.classList.toggle('active', key === r.name || (r.name === 'archive' && key === `cat:${r.cat}`) || (r.name === 'archive' && key === 'archive' && !r.cat));
    });
    if (r.name === 'admin' && !state.isAdmin) { go('/'); return; }
    try {
      if (r.name === 'home') await renderHome(reload);
      else if (r.name === 'archive') await renderArchive(reload);
      else if (r.name === 'episode') await renderEpisode(reload);
      else if (r.name === 'admin') await renderAdmin(reload);
    } catch (e) {
      $('#main').innerHTML = `<div class="page"><div class="card empty"><b>読み込めませんでした</b>${esc(e.message)}</div></div>`;
    }
    player.renderState();
    window.scrollTo({ top: reload ? 0 : window.scrollY });
  }

  async function loadEpisodes(params = {}) {
    const qs = new URLSearchParams();
    if (params.category) qs.set('category', params.category);
    if (params.q) qs.set('q', params.q);
    if (params.include_drafts) qs.set('include_drafts', '1');
    const data = await api(`/api/episodes${qs.toString() ? '?' + qs : ''}`);
    state.episodes = data.episodes;
    return data.episodes;
  }
  async function loadCategories() {
    state.categories = (await api('/api/categories')).categories;
    renderNav();
  }

  /* ───────── ナビ ───────── */
  function renderNav() {
    const cats = state.categories.map((c) => `
      <a class="nav-item" href="#/archive/${c.id}" data-nav="cat:${c.id}">
        <span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}<span class="cnt num">${c.episode_count || 0}</span>
      </a>`).join('');
    $('#nav').innerHTML = `
      <a class="nav-item" href="#/" data-nav="home">${NAV_ICON.home}ホーム</a>
      <a class="nav-item" href="#/archive" data-nav="archive">${NAV_ICON.archive}アーカイブ<span class="cnt num">${state.categories.reduce((a, c) => a + (c.episode_count || 0), 0)}</span></a>
      <div class="nav-label">カテゴリー</div>
      ${cats}
      ${state.isAdmin ? `<div class="nav-label">管理者</div><button class="quick-rec" type="button" data-quick-record="">${ICON.mic}<span>録音して配信</span></button><a class="nav-item" href="#/admin" data-nav="admin">${NAV_ICON.admin}配信管理・視聴状況</a>` : ''}
    `;
    $('#me').innerHTML = state.me ? `<b>${esc(state.me.name)}</b>${state.isAdmin ? '<span class="pill admin" style="margin:4px 0">管理者</span><br>' : ''}<span>${esc(state.me.email)}</span><br><button id="rename">表示名を変更</button>` : '';
    if (window.__DEMO__ && state.me) {
      const opts = window.demoMembers().map((m) => `<option value="${m.id}" ${m.id === state.me.id ? 'selected' : ''}>${esc(m.name)}${m.role === 'admin' ? '（管理者）' : ''}</option>`).join('');
      $('#me').insertAdjacentHTML('beforeend', `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.15)"><div style="font-size:10px;letter-spacing:.14em;color:var(--orange-l);margin-bottom:4px">デモ: ユーザーを切り替え</div><select class="select" id="demo-user" style="padding:5px 8px;font-size:12px;background:var(--navy-mid);color:#fff;border-color:rgba(255,255,255,.2)">${opts}</select><button id="demo-reset" style="margin-top:6px;color:rgba(255,255,255,.5)">デモデータを初期化</button></div>`);
      $('#demo-user').addEventListener('change', (e) => window.demoSwitchUser(e.target.value));
      $('#demo-reset').addEventListener('click', () => { if (confirm('デモデータを初期状態に戻しますか？')) window.demoReset(); });
    }
  }
  const NAV_ICON = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18v13H3zM3 4h18v3H3zM10 11h4"/></svg>',
    admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  };

  /* ───────── 画面: ホーム ───────── */
  async function renderHome(reload) {
    if (reload || !state.episodes.length) await loadEpisodes();
    const eps = state.episodes;
    const inProgress = eps.filter((e) => e.my_last_played_at && !e.my_completed).slice(0, 4);
    const unheard = eps.filter((e) => !e.my_last_played_at);
    const latest = eps.slice(0, 6);
    const done = eps.filter((e) => e.my_completed).length;
    $('#main').innerHTML = `
      <div class="page">
        <div class="hero">
          <div>
            <span class="en">Internal Voice Library</span>
            <h2>${esc(state.me.name)} さん、おかえりなさい</h2>
            <p>${unheard.length ? `まだ聴いていない配信が ${unheard.length} 件あります。` : 'すべての配信を再生済みです。'}移動中や作業の合間にどうぞ。</p>
            ${state.isAdmin ? `<div class="hero-actions"><button class="btn primary" type="button" data-quick-record=""><span class="ico">${ICON.mic}</span>録音して配信</button>${state.categories.slice(0, 4).map((c) => `<button class="btn hero-cat" type="button" data-quick-record="${c.id}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('')}</div>` : ''}
          </div>
          <div class="stats">
            <div class="stat"><b class="num">${eps.length}</b><span>配信数</span></div>
            <div class="stat"><b class="num">${done}</b><span>聴了</span></div>
            <div class="stat"><b class="num">${unheard.length}</b><span>未再生</span></div>
          </div>
        </div>
        ${inProgress.length ? `<h3 class="section">続きから聴く</h3><div class="ep-list">${inProgress.map(rowHtml).join('')}</div>` : ''}
        <h3 class="section">新着の配信 <a class="more" href="#/archive">すべて見る</a></h3>
        ${latest.length ? `<div class="ep-list">${latest.map(rowHtml).join('')}</div>` : `<div class="card empty"><b>まだ配信がありません</b>${state.isAdmin ? '<div style="margin-top:12px"><button class="btn primary" type="button" data-quick-record=""><span class="ico">' + ICON.mic + '</span>最初の配信を録音する</button></div>' : '配信されるとここに表示されます。'}</div>`}
        <h3 class="section">カテゴリーから探す</h3>
        <div class="chips">${state.categories.map((c) => `<a class="chip" href="#/archive/${c.id}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}<span class="n">${c.episode_count || 0}</span></a>`).join('')}</div>
      </div>`;
  }

  function rowHtml(ep) {
    const p = pct(ep);
    return `
      <div class="ep-row" data-open="${ep.id}">
        <button class="play-btn" data-play="${ep.id}" aria-label="再生">${ICON.play}</button>
        <div class="body">
          <div class="meta">${catPill(ep)}<span>${fmtDate(ep.published_at || ep.created_at)}</span>${ep.duration_sec ? `<span>${fmtDur(ep.duration_sec)}</span>` : ''}${ep.status === 'draft' ? '<span class="pill draft">下書き</span>' : ''}</div>
          <div class="title">${esc(ep.title)}</div>
          ${ep.description ? `<div class="desc">${esc(ep.description)}</div>` : ''}
          ${ep.my_last_played_at ? `<div class="progress ${ep.my_completed ? 'done' : ''}"><i style="width:${p}%"></i></div>` : ''}
        </div>
        <div class="side">${statusPill(ep)}<span>💬 ${ep.comment_count || 0}</span></div>
      </div>`;
  }

  /* ───────── 画面: アーカイブ ───────── */
  async function renderArchive(reload) {
    const r = state.route;
    const eps = await loadEpisodes({ category: r.cat, q: r.q });
    const cat = state.categories.find((c) => String(c.id) === String(r.cat));
    $('#main').innerHTML = `
      <div class="page">
        <div class="page-head">
          <div><span class="en">Archive</span><h2>${cat ? esc(cat.name) : 'すべての配信'}</h2><p>${cat ? `${cat.name} の配信 ${eps.length} 件` : `過去の配信 ${eps.length} 件。カテゴリーやキーワードで絞り込めます`}</p></div>
          ${state.isAdmin ? `<button class="btn primary" type="button" data-quick-record="${cat ? cat.id : ''}"><span class="ico">${ICON.mic}</span>${cat ? esc(cat.name) + 'に' : ''}録音して配信</button>` : ''}
        </div>
        <div class="toolbar">
          <div class="chips">
            <a class="chip ${!r.cat ? 'active' : ''}" href="#/archive">すべて</a>
            ${state.categories.map((c) => `<a class="chip ${String(c.id) === String(r.cat) ? 'active' : ''}" href="#/archive/${c.id}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}<span class="n">${c.episode_count || 0}</span></a>`).join('')}
          </div>
        </div>
        <div class="toolbar">
          <input class="input" id="search" type="search" placeholder="タイトル・説明・文字起こしから検索" value="${esc(r.q)}">
          <select class="select" id="filter" style="max-width:160px">
            <option value="">すべての状態</option><option value="unheard">未再生</option><option value="partial">途中</option><option value="done">聴了</option>
          </select>
        </div>
        <div class="ep-list" id="list">${eps.length ? eps.map(rowHtml).join('') : '<div class="card empty"><b>該当する配信がありません</b>条件を変えて探してみてください。</div>'}</div>
      </div>`;
    $('#search').addEventListener('change', (e) => go(`/archive/${r.cat}?q=${encodeURIComponent(e.target.value.trim())}`));
    $('#filter').addEventListener('change', (e) => {
      const f = e.target.value;
      const filtered = eps.filter((ep) => !f || (f === 'unheard' && !ep.my_last_played_at) || (f === 'partial' && ep.my_last_played_at && !ep.my_completed) || (f === 'done' && ep.my_completed));
      $('#list').innerHTML = filtered.length ? filtered.map(rowHtml).join('') : '<div class="card empty"><b>該当する配信がありません</b></div>';
      player.renderState();
    });
  }

  /* ───────── 画面: エピソード詳細 ───────── */
  async function renderEpisode(reload) {
    const id = state.route.id;
    if (reload || !state.detail || state.detail.episode.id !== id) state.detail = await api(`/api/episodes/${id}`);
    const { episode: ep, comments } = state.detail;
    const isPlaying = player.ep && player.ep.id === ep.id && !audio.paused;
    $('#main').innerHTML = `
      <div class="page">
        <div class="ep-head">
          <button class="play-btn lg" data-play="${ep.id}" aria-label="再生">${isPlaying ? ICON.pause : ICON.play}</button>
          <div>
            <div class="meta">${catPill(ep)}<span>${fmtDate(ep.published_at || ep.created_at)}</span>${ep.duration_sec ? `<span>${fmtDur(ep.duration_sec)}</span>` : ''}${statusPill(ep)}${ep.status === 'draft' ? '<span class="pill draft">下書き（メンバーには非表示）</span>' : ''}</div>
            <h2>${esc(ep.title)}</h2>
            <div class="sub">${ep.created_by_name ? `配信: ${esc(ep.created_by_name)} ・ ` : ''}${ep.listener_count || 0} 人が再生${ep.my_last_played_at && !ep.my_completed ? ` ・ ${fmtTime(ep.my_position_sec)} まで再生済み` : ''}</div>
          </div>
        </div>
        <div class="card ep-desc" style="margin-top:14px">${esc(ep.description)}</div>
        ${knowledgeHtml(ep)}
        <h3 class="section">コメント <span class="muted small" style="font-family:var(--sans);font-weight:400">${comments.length} 件</span></h3>
        <div class="comments" id="comments">${comments.length ? comments.map(commentHtml).join('') : '<div class="card empty">最初のコメントを書いてみましょう。感想や質問、気づきなど何でも。</div>'}</div>
        <form class="comment-form" id="comment-form" style="margin-top:14px">
          <div class="avatar o">${initial(state.me.name)}</div>
          <div>
            <textarea class="textarea" id="comment-body" placeholder="感想・質問・気づきを書く（2000文字まで）" maxlength="2000" required></textarea>
            <div class="actions"><span class="muted small">${esc(state.me.name)} として投稿</span><button class="btn primary" type="submit">投稿する</button></div>
          </div>
        </form>
      </div>`;
    $('#comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = $('#comment-body').value.trim();
      if (!body) return;
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const r = await api(`/api/episodes/${ep.id}/comments`, { method: 'POST', json: { body } });
        state.detail.comments.push(r.comment);
        ep.comment_count = (ep.comment_count || 0) + 1;
        toast('コメントを投稿しました');
        renderEpisode(false);
      } catch (err) { toast(err.message, true); btn.disabled = false; }
    });
  }
  /* 要約・文字起こし・Notion リンク（ナレッジ連携の結果） */
  function knowledgeHtml(ep) {
    const st = ep.knowledge_status || 'none';
    let html = '';
    if (ep.summary) {
      html += `<h3 class="section">要約 ${ep.notion_page_url ? `<a class="more" href="${esc(ep.notion_page_url)}" target="_blank" rel="noopener">Notion の議事録DBで開く</a>` : ''}</h3>
        <div class="card ep-desc">${esc(ep.summary)}</div>`;
    }
    if (ep.transcript) {
      html += `<details class="card transcript"><summary>文字起こし全文を表示</summary><div class="ep-desc">${esc(ep.transcript)}</div></details>`;
    }
    if (state.isAdmin) {
      if (st === 'pending' || st === 'processing') html += `<p class="muted small" style="margin-top:12px">${st === 'processing' ? '文字起こしを処理中です' : '文字起こしを待機中です（5分以内に始まります）'}。終わると要約と Notion のリンクがここに出ます。</p>`;
      if (st === 'error') html += `<div class="card" style="margin-top:12px;padding:14px 18px;border-color:var(--red)"><b style="color:var(--red)">ナレッジ連携でエラー</b><div class="small muted" style="margin:4px 0 10px">${esc(ep.knowledge_error || '')}</div><button class="btn ghost sm" data-retry="${ep.id}">もう一度処理する</button></div>`;
      if (st === 'done' && !ep.notion_page_url && ep.knowledge_error) html += `<p class="muted small" style="margin-top:12px">${esc(ep.knowledge_error)}</p>`;
    }
    return html;
  }
  function knowledgePill(ep) {
    const st = ep.knowledge_status || 'none';
    if (ep.status !== 'published') return '<span class="muted small">—</span>';
    if (st === 'pending') return '<span class="pill">待機中</span>';
    if (st === 'processing') return '<span class="pill partial">処理中</span>';

      <h3>${quick ? `${cat ? esc(cat.name) + 'に' : ''}録音して配信` : isNew ? '新しい配信を登録' : '配信を編集'}</h3>
      <form id="ep-form" class="form-grid">

            <label>音声${isNew ? '' : '（差し替える場合のみ）'}</label>
            <div class="seg" role="tablist"><button type="button" class="${quick ? '' : 'active'}" data-mode="file">ファイルを選ぶ</button><button type="button" class="${quick ? 'active' : ''}" data-mode="record">その場で録音</button></div>
          </div>
          <div id="file-panel" ${quick ? 'hidden' : ''}>
            <label class="upload-box" id="drop"><input type="file" name="file" accept="audio/*,.mp3,.m4a,.wav,.ogg"><b id="file-name">${isNew ? 'ここにドラッグ、またはクリックして選択' : '差し替えるファイルを選択'}</b>mp3 / m4a / wav / ogg、1ファイル 200MB まで</label>

            <div class="rec-time" id="rec-time">0:00</div>
            <div class="rec-status" id="rec-status">ボタンを押すと録音が始まります</div>
            <button type="button" class="rec-btn" id="rec-btn" aria-label="録音 / 停止">${ICON.mic}</button>
            <div class="rec-level" id="rec-level"><i></i></div>
            <div class="rec-actions"><button type="button" class="btn ghost sm" id="rec-pause" hidden>一時停止</button><button type="button" class="btn ghost sm" id="rec-redo" hidden>録り直す</button></div>
            <div class="rec-preview" id="rec-preview" hidden></div>
            <div class="rec-hint">録音は自動で MP3 になり、iPhone でも PC でも再生できます。静かな場所で、口元から 20cm ほど離して話すと聴きやすくなります</div>
            <div class="rec-hint" id="rec-unsupported" hidden style="color:var(--red)">このブラウザは録音に対応していません。Chrome / Safari / Edge の最新版でお試しください</div>
          </div>
          <div class="upload-bar" id="upload-bar" hidden><i></i></div>
        </div>
        ${quick ? metaHtml : ''}
      </form>
      <div class="foot"><button class="btn ghost" data-close>キャンセル</button><button class="btn primary" id="ep-save">${quick ? '配信する' : isNew ? '登録する' : '保存する'}</button></div>`, () => {
      const R = window.AudioRecorder;
      if (R && R.state !== 'idle') { R.cancel(); toast('録音を破棄しました'); }
    });
    const form = $('#ep-form');
    const fileInput = form.querySelector('input[type=file]');
    const drop = $('#drop');
    if (isNew) form.querySelector('[name=status]').value = 'published';

    fileInput.addEventListener('change', () => { if (fileInput.files[0]) $('#file-name').textContent = `${fileInput.files[0].name}（${(fileInput.files[0].size / 1024 / 1024).toFixed(1)} MB）`; });
    ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); } });

    /* ── その場で録音 ── */
    const R = window.AudioRecorder;
    let mode = quick ? 'record' : 'file';
    let recorded = null; // { file, duration, url }
    const segBtns = form.querySelectorAll('.seg button');
    segBtns.forEach((b) => b.addEventListener('click', () => {
      mode = b.dataset.mode;
      segBtns.forEach((x) => x.classList.toggle('active', x === b));
      $('#file-panel').hidden = mode !== 'file';
      $('#rec-panel').hidden = mode !== 'record';
    }));
    const recBtn = $('#rec-btn'), recTime = $('#rec-time'), recStatus = $('#rec-status'), recLevel = $('#rec-level > i'), recPause = $('#rec-pause'), recRedo = $('#rec-redo'), recPreview = $('#rec-preview');
    if (!R || !R.supported) { $('#rec-unsupported').hidden = false; recBtn.disabled = true; }
    function renderRec() {
      const st = R ? R.state : 'idle';
      const active = st === 'recording' || st === 'paused';
      recBtn.innerHTML = active ? ICON.stop : ICON.mic;
      recBtn.classList.toggle('stop', active);
      recBtn.disabled = st === 'stopping' || !(R && R.supported);
      recPause.hidden = !active;
      recPause.textContent = st === 'paused' ? '再開する' : '一時停止';
      recStatus.innerHTML = st === 'recording' ? '<span class="live"></span>録音中（もう一度押すと停止）'
        : st === 'paused' ? '<span class="live paused"></span>一時停止中'
        : st === 'stopping' ? 'MP3 に書き出しています…'
        : recorded ? '録音できました。下で聴き直してから登録してください' : 'ボタンを押すと録音が始まります';
      recRedo.hidden = !(recorded && st === 'idle');
      recPreview.hidden = !(recorded && st === 'idle');
    }
    recBtn.addEventListener('click', async () => {
      if (!R || !R.supported) return;
      if (R.state === 'idle') {
        try {
          if (recorded && recorded.url) URL.revokeObjectURL(recorded.url);
          recorded = null; recPreview.innerHTML = ''; recTime.textContent = '0:00';
          await R.start({
            onLevel: (v) => { recLevel.style.width = `${Math.round(v * 100)}%`; },
            onTime: (t) => { recTime.textContent = fmtTime(t); },
          });
        } catch (e) { toast(e.message, true); }
        renderRec();
        return;
      }
      if (R.state === 'recording' || R.state === 'paused') {
        try {
          const p = R.stop();
          renderRec();
          const r = await p;
          recorded = { file: r.file, duration: r.duration, url: URL.createObjectURL(r.blob) };
          recTime.textContent = fmtTime(r.duration);
          const size = r.blob.size >= 1024 * 1024 ? `${(r.blob.size / 1024 / 1024).toFixed(1)} MB` : `${Math.round(r.blob.size / 1024)} KB`;
          recPreview.innerHTML = `<div class="muted small">長さ ${fmtTime(r.duration)} ・ ${size}（MP3）</div><audio controls preload="metadata" src="${recorded.url}"></audio>`;
          if (r.duration < 1) { toast('録音が短すぎます。もう一度録音してください', true); recorded = null; }
        } catch (e) { toast(e.message, true); }
        recLevel.style.width = '0%';
        renderRec();
      }
    });
    recPause.addEventListener('click', () => { if (!R) return; if (R.state === 'recording') R.pause(); else if (R.state === 'paused') R.resume(); renderRec(); });
    recRedo.addEventListener('click', () => { if (recorded && recorded.url) URL.revokeObjectURL(recorded.url); recorded = null; recTime.textContent = '0:00'; recPreview.innerHTML = ''; renderRec(); });
    renderRec();

    $('#ep-save').addEventListener('click', async () => {
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      let file = fileInput.files[0];
      let recDuration = null;
      if (mode === 'record') {
        if (R && (R.state === 'recording' || R.state === 'paused')) { toast('録音を停止してから登録してください', true); return; }
        if (!recorded) { toast('先に録音してください', true); return; }
        file = recorded.file;
        recDuration = recorded.duration;
      }
      if (isNew && !file) { toast(mode === 'record' ? '先に録音してください' : '音声ファイルを選択してください', true); return; }
      const btn = $('#ep-save');
      btn.disabled = true;
      try {
        let duration = recDuration;
        if (file && duration == null) duration = await probeDuration(file);
        const payload = { title: fd.get('title'), description: fd.get('description'), category_id: fd.get('category_id') ? Number(fd.get('category_id')) : null, duration_sec: duration };
        let id = ep?.id;
        if (isNew) id = (await api('/api/admin/episodes', { method: 'POST', json: payload })).id;
        else await api(`/api/admin/episodes/${id}`, { method: 'PUT', json: payload });
        if (file) {
          btn.textContent = 'アップロード中…';
          $('#upload-bar').hidden = false;
          await uploadAudio(id, file, duration, (p) => { $('#upload-bar > i').style.width = `${Math.round(p * 100)}%`; });
        }
        await api(`/api/admin/episodes/${id}`, { method: 'PUT', json: { ...payload, status: fd.get('status') } });
        toast(fd.get('status') === 'published' ? '配信しました' : isNew ? '下書きとして保存しました' : '保存しました');
        closeModal();
        await loadCategories();
        if (quick) go(payload.category_id ? `/archive/${payload.category_id}` : '/archive');
        else renderRoute();
      } catch (err) { toast(err.message, true); btn.disabled = false; btn.textContent = quick ? '配信する' : isNew ? '登録する' : '保存する'; }
    });
  }

  function probeDuration(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const a = new Audio();
      a.preload = 'metadata';
      a.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(isFinite(a.duration) ? a.duration : null); };
      a.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      a.src = url;
    });
  }
  function guessType(file) {
    if (file.type && file.type !== 'application/octet-stream') return file.type;
    const ext = file.name.split('.').pop().toLowerCase();
    return { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', webm: 'audio/webm' }[ext] || 'application/octet-stream';
  }
  function uploadAudio(id, file, duration, onProgress) {
    if (window.__DEMO__) return window.demoUpload(id, file, duration, onProgress);
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', `/api/admin/episodes/${id}/audio`);
      xhr.setRequestHeader('Content-Type', guessType(file));
      if (duration) xhr.setRequestHeader('X-Audio-Duration', String(duration));
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let data = {};
        try { data = JSON.parse(xhr.responseText); } catch (e) { /* noop */ }
        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
        else reject(new Error(data.error || `アップロードに失敗しました (${xhr.status})`));
      };
      xhr.onerror = () => reject(new Error('アップロードに失敗しました。通信環境を確認してください'));
      xhr.send(file);
    });
  }
